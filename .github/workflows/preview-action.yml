name: Preview Action

on:
  pull_request:
    paths:
      - '.github/actions/build-preview/**'
      - '.github/workflows/preview-action.yml'
      - 'examples/minimal-theme/**'
      - 'include/**'
      - 'boards/shields/dongle_screen_host/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'web/**'
  push:
    branches: [main, preview/v2.0]
    paths:
      - '.github/actions/build-preview/**'
      - '.github/workflows/preview-action.yml'
      - 'examples/minimal-theme/**'
      - 'include/**'
      - 'boards/shields/dongle_screen_host/**'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-pack-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the allocation-free Format 1 envelope
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iinclude src/v2/pack.c tests/pack_v2.c \
            -o /tmp/zdse-pack-v2-test
          /tmp/zdse-pack-v2-test

  minimal-theme:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out LVGL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zmkfirmware/lvgl
          ref: f1db87ee98f1810328a8419572fa42a3b5f352ae
          path: .preview-deps/lvgl

      - name: Build minimal preview
        id: preview
        uses: ./.github/actions/build-preview
        with:
          theme-path: examples/minimal-theme
          lvgl-path: .preview-deps/lvgl
          output-path: .build/minimal-action-preview

      - name: Check Action output
        shell: bash
        env:
          ZDSE_INDEX_PATH: ${{ steps.preview.outputs.index-path }}
        run: test -s "$ZDSE_INDEX_PATH"

      - name: Run C ABI and raster tests
        run: python3 scripts/test_engine.py --lvgl .preview-deps/lvgl
